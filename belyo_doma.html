<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f3ee">
<title>Бельё дома — уютный помощник</title>
<style>
:root{--sage:#8fa996;--sage-dark:#637d6b;--sage-soft:#e9f0e9;--pink:#e9b8c7;--pink-soft:#f9e9ee;--cream:#f8f3ee;--cream-2:#fffaf7;--ink:#30352f;--muted:#7d837d;--line:#e7e4df;--white:#fff;--shadow:0 12px 32px rgba(82,92,78,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#faf6f2,#f5f1ed);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body.theme-pink{--sage:#d99aaf;--sage-dark:#a96f83;--sage-soft:#f8e5ec}
body.theme-lilac{--sage:#a99bc9;--sage-dark:#7e6e9e;--sage-soft:#eee9f7}
body.theme-dark{--sage:#8fa996;--sage-dark:#536e5c;--sage-soft:#36453a;--pink-soft:#48333c;--cream:#242924;--cream-2:#2d332d;--ink:#f4f1ec;--muted:#b1b8b0;--line:#444b44;--white:#303730;background:#202520}
*{ -webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer}
.app{width:min(100%,520px);margin:auto;min-height:100vh;padding-bottom:105px}
header{padding:28px 18px 14px}.eyebrow{color:var(--sage-dark);font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
h1{margin:6px 0 5px;font-size:32px;line-height:1.05}.subtitle{margin:0;color:var(--muted);font-size:15px}
.card{margin:12px 16px;padding:17px;background:rgba(255,250,247,.94);border:1px solid rgba(120,120,110,.07);border-radius:24px;box-shadow:var(--shadow)}
body.theme-dark .card,body.theme-dark .bottom-nav{background:var(--cream-2)}
body.theme-dark input,body.theme-dark select{background:#353c35;color:var(--ink)}
.weather-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,var(--sage-soft),var(--cream-2))}
.weather-left{display:flex;align-items:center;gap:12px}.weather-icon{width:50px;height:50px;display:grid;place-items:center;border-radius:17px;background:rgba(255,255,255,.65);font-size:27px}.weather-temp{font-size:24px;font-weight:850}.weather-text{margin-top:3px;color:var(--muted);font-size:12px}
.small-button{border:0;padding:9px 11px;border-radius:13px;background:var(--white);color:var(--sage-dark);font-weight:750}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 18px 9px;gap:10px}.section-head h2{margin:0;font-size:20px}.counter{min-width:27px;padding:5px 9px;border-radius:999px;background:var(--pink-soft);color:var(--sage-dark);font-size:12px;font-weight:800;text-align:center}
.section-caption{margin:0 18px 12px;color:var(--muted);font-size:12px;line-height:1.5}.page-title{margin:25px 18px 12px;font-size:22px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}.empty-icon{font-size:44px;margin-bottom:8px}.empty-title{color:var(--ink);font-size:16px;font-weight:800}
.add-button{width:calc(100% - 32px);margin:18px 16px;padding:17px;border:0;border-radius:19px;background:var(--sage-dark);color:white;font-size:16px;font-weight:850;box-shadow:0 10px 24px rgba(99,125,107,.22)}
.action{border:0;padding:11px 10px;border-radius:14px;background:#f0ebe6;color:var(--ink);font-size:12px;font-weight:750}.action.primary{background:var(--sage-dark);color:white}.action.pink{background:var(--pink-soft);color:var(--sage-dark)}
.actions{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}.actions .action{flex:1;min-width:75px}
.load-card{position:relative;overflow:hidden}.load-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.load-name{font-size:18px;font-weight:850;overflow-wrap:anywhere}.load-place{margin-top:4px;color:var(--muted);font-size:12px}
.badge{flex-shrink:0;padding:7px 10px;border-radius:999px;background:var(--pink-soft);color:var(--sage-dark);font-size:11px;font-weight:850}
.progress-wrap{height:9px;margin:17px 0 10px;overflow:hidden;border-radius:999px;background:var(--line)}.progress{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sage),#b6c9b5)}
.info{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:6px}.info strong{color:var(--ink)}
.notice{margin:14px 18px;padding:13px 14px;border-radius:17px;background:#fff5e5;color:#876f50;font-size:11px;line-height:1.5}
.form-card{display:none}.form-card.active{display:block}.form-title{margin:0 0 4px;font-size:21px}.form-subtitle{margin:0 0 17px;color:var(--muted);font-size:12px}
label{display:block;margin:14px 0 7px;color:var(--sage-dark);font-size:12px;font-weight:800}
input,select{width:100%;min-height:47px;padding:12px 13px;border:1px solid var(--line);border-radius:15px;outline:0;background:var(--white);color:var(--ink)}
input:focus,select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(143,169,150,.13)}
.form-buttons{display:flex;gap:9px;margin-top:18px}.form-buttons button{flex:1;padding:14px;border:0;border-radius:15px;font-weight:800}.save-button{background:var(--sage);color:white}.cancel-button{background:#eee8e2;color:var(--ink)}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.settings-label{font-size:14px;font-weight:700}.settings-help{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}
.settings-row select{width:48%;min-height:42px;padding:8px;font-size:12px}.settings-row input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--sage-dark)}.settings-row input[type=text]{width:48%;min-height:42px;padding:8px;font-size:12px}
.settings-action{width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;background:var(--sage-soft);color:var(--sage-dark);font-weight:800;text-align:left}.small-note{font-size:11px;color:var(--muted);line-height:1.5}
.machine-chip,.tag{display:inline-block;margin:5px 5px 0 0;padding:7px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage-dark);font-size:11px;font-weight:750}
.bottom-nav{position:fixed;z-index:20;left:50%;bottom:10px;width:min(500px,calc(100% - 12px));transform:translateX(-50%);display:flex;overflow-x:auto;justify-content:flex-start;padding:8px 5px;border:1px solid rgba(120,120,110,.09);border-radius:23px;background:rgba(255,250,247,.94);backdrop-filter:blur(18px);box-shadow:0 10px 35px rgba(70,60,50,.15)}
.nav-button{flex:0 0 66px;padding:7px 3px;border:0;border-radius:15px;background:transparent;color:var(--muted);font-size:9px;font-weight:650}.nav-icon{display:block;margin-bottom:3px;font-size:19px}.nav-button.active{background:var(--sage-soft);color:var(--sage-dark)}
.toast{position:fixed;z-index:50;left:50%;bottom:92px;max-width:calc(100% - 40px);padding:12px 17px;border-radius:15px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#3f473f;color:white;font-size:12px;text-align:center;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}.hidden{display:none!important}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px}.summary{padding:15px;border-radius:19px;background:var(--sage-soft)}.summary .num{font-size:20px;font-weight:850;margin-top:4px}.summary .lbl{font-size:11px;color:var(--muted)}
.account{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.account:last-child{border-bottom:0}.account-name{font-weight:800}.money{font-weight:850}.positive{color:var(--sage-dark)}.negative{color:#b25f68}
.task{display:flex;gap:11px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task-check{width:28px;height:28px;border-radius:10px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;flex:none}.task-check.done{background:var(--sage);color:#fff}.task-main{flex:1;min-width:0}.task-title{font-weight:800;overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task-time{margin-top:4px;color:var(--muted);font-size:11px}.task-actions{display:flex;gap:5px}.task-actions button{border:0;background:transparent;color:var(--muted);padding:5px}
.hero-mini{background:linear-gradient(135deg,var(--sage-soft),var(--pink-soft));padding:18px;border-radius:24px;margin:12px 16px}.hero-mini h2{margin:0 0 6px;font-size:19px}.hero-mini p{margin:0;color:var(--muted);font-size:12px}
@media(max-width:360px){h1{font-size:29px}.nav-button{flex-basis:62px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="eyebrow">Бельё дома ♡</div>
  <h1 id="greeting">Привет! 🧺</h1>
  <p class="subtitle" id="subtitle">Твой уютный помощник по дому.</p>
</header>

<div class="card weather-card" id="weatherCard">
  <div class="weather-left"><div class="weather-icon" id="weatherIcon">☁️</div><div><div class="weather-temp" id="weatherTemp">—°</div><div class="weather-text" id="weatherText">Загружаем погоду…</div></div></div>
  <button class="small-button" id="refreshWeather">↻</button>
</div>

<main id="pageContent"></main>

<nav class="bottom-nav">
  <button class="nav-button active" data-page="home"><span class="nav-icon">🏠</span>Главная</button>
  <button class="nav-button" data-page="plan"><span class="nav-icon">📋</span>План</button>
  <button class="nav-button" data-page="laundry"><span class="nav-icon">🧺</span>Стирки</button>
  <button class="nav-button" data-page="budget"><span class="nav-icon">💰</span>Бюджет</button>
  <button class="nav-button" data-page="pet"><span class="nav-icon">🐾</span>Питомец</button>
  <button class="nav-button" data-page="settings"><span class="nav-icon">⚙️</span>Настройки</button>
</nav>
<div class="toast" id="toast"></div>
</div>

<script>
'use strict';

const STORAGE_KEY='belyo_doma_v2';
const SETTINGS_KEY='belyo_doma_settings_v1';
const MACHINES_KEY='belyo_doma_machines_v1';
const PROGRAMS_KEY='belyo_doma_programs_v1';
const TASKS_KEY='belyo_doma_tasks_v1';
const BUDGET_KEY='belyo_doma_budget_v1';

let loads=[],tasks=[];
let settings={theme:'sage',timeFormat:'24',notifications:false,showWeather:true,defaultMachine:'Машинка 1',language:'ru',name:''};
let machines=['Машинка 1'],customPrograms=[];
let budget={accounts:[],transactions:[],mandatory:[]};
let editingId=null,currentPage='home',toastTimer=null;
let weather={temp:null,humidity:null,code:null};

const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function read(key,fallback){try{let x=JSON.parse(localStorage.getItem(key));return x==null?fallback:x}catch(e){return fallback}}
function toast(m){let e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2500)}
function money(n){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2}).format(Number(n)||0)}
function num(v){return Number(String(v).replace(',','.'))||0}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(s){if(!s)return '';let d=new Date(s+'T12:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function clock(s){return s||'—'}
function uid(){return Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function saveAll(){localStorage.setItem(STORAGE_KEY,JSON.stringify(loads));localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));localStorage.setItem(MACHINES_KEY,JSON.stringify(machines));localStorage.setItem(PROGRAMS_KEY,JSON.stringify(customPrograms));localStorage.setItem(TASKS_KEY,JSON.stringify(tasks));localStorage.setItem(BUDGET_KEY,JSON.stringify(budget))}
function applyTheme(){document.body.classList.remove('theme-pink','theme-lilac','theme-dark');if(settings.theme==='pink')document.body.classList.add('theme-pink');if(settings.theme==='lilac')document.body.classList.add('theme-lilac');if(settings.theme==='dark')document.body.classList.add('theme-dark');$('weatherCard').classList.toggle('hidden',!settings.showWeather)}

function loadSaved(){
 loads=Array.isArray(read(STORAGE_KEY,[]))?read(STORAGE_KEY,[]):[];
 settings={...settings,...read(SETTINGS_KEY,{})};
 machines=read(MACHINES_KEY,['Машинка 1']);if(!Array.isArray(machines)||!machines.length)machines=['Машинка 1'];
 customPrograms=read(PROGRAMS_KEY,[]);if(!Array.isArray(customPrograms))customPrograms=[];
 tasks=read(TASKS_KEY,[]);if(!Array.isArray(tasks))tasks=[];
 budget={...budget,...read(BUDGET_KEY,{})};
 if(!Array.isArray(budget.accounts))budget.accounts=[];if(!Array.isArray(budget.transactions))budget.transactions=[];if(!Array.isArray(budget.mandatory))budget.mandatory=[];
 loads=loads.map(x=>({...x,machine:x.machine||machines[0],startedAt:Number(x.startedAt)||Number(x.createdAt)||Date.now(),duration:Number(x.duration)||60,done:Boolean(x.done)}));
 applyTheme();
}

function fabricName(v){return({cotton:'Хлопок',synthetic:'Синтетика',mixed:'Смешанная ткань',delicate:'Деликатное',towels:'Полотенца',bed:'Постельное бельё'})[v]||v||'Не указано'}
function placeName(v){return({balcony:'Балкон',glazed:'Застеклённый балкон',radiator:'Батарея',room:'В комнате',dryer:'Сушильная машина'})[v]||v||'Не указано'}
function spinName(v){return({low:'Низкий',medium:'Средний',high:'Высокий'})[v]||'Средний'}
function dryMinutes(x){let m=({cotton:165,synthetic:100,mixed:135,delicate:115,towels:190,bed:180})[x.fabric]||145;if(x.spin==='low')m+=35;if(x.spin==='high')m-=20;if(x.amount==='small')m-=20;if(x.amount==='large')m+=35;if(x.air==='still')m+=25;if(x.air==='windy')m-=30;if(x.place==='radiator')m-=25;if(x.place==='room')m+=30;if(x.place==='dryer')m=Math.min(m,90);if(weather.humidity>=80&&x.place!=='dryer')m+=35;else if(weather.humidity>=65&&x.place!=='dryer')m+=20;return Math.max(30,Math.round(m/5)*5)}
function fmtClock(t){let d=new Date(t);return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:settings.timeFormat==='12'})}
function fmtDT(t){let d=new Date(t);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'})+' · '+fmtClock(t)}
function durText(ms){let m=Math.ceil(ms/60000);if(m<60)return m+' мин';let h=Math.floor(m/60),r=m%60;return r?h+' ч '+r+' мин':h+' ч'}
function stage(x){if(x.done)return{stage:2,title:'Завершено ✨',progress:100,remaining:'Готово'};let now=Date.now(),w=x.startedAt+x.duration*60000;if(now<w)return{stage:0,title:'Стирается',progress:Math.max(1,Math.min(99,Math.round((now-x.startedAt)/(x.duration*60000)*100))),remaining:durText(w-now)};let d=dryMinutes(x),e=w+d*60000;if(now<e)return{stage:1,title:'Сушится',progress:Math.max(1,Math.min(99,Math.round((now-w)/(d*60000)*100))),remaining:durText(e-now)};return{stage:2,title:'Пора проверить',progress:100,remaining:'Время проверить'}}
function machineOptions(sel){return machines.map(m=>`<option value="${esc(m)}" ${m===sel?'selected':''}>${esc(m)}</option>`).join('')}
function programOptions(sel){let a=[['cotton','Хлопок'],['synthetic','Синтетика'],['mixed','Смешанная ткань'],['delicate','Деликатное'],['towels','Полотенца'],['bed','Постельное бельё']].concat(customPrograms.map(p=>[p.fabric,p.name]));return a.map(p=>`<option value="${esc(p[0])}" ${p[0]===sel?'selected':''}>${esc(p[1])}</option>`).join('')}

function loadCard(x,history=false){let s=stage(x),we=x.startedAt+x.duration*60000,de=we+dryMinutes(x)*60000;return `<div class="card load-card"><div class="load-top"><div><div class="load-name">${esc(x.name)}</div><div class="load-place">${esc(x.machine)} · ${esc(placeName(x.place))}</div></div><div class="badge">${s.title}</div></div><div class="progress-wrap"><div class="progress" style="width:${s.progress}%"></div></div><div class="info"><span>${x.done?'Завершено':s.stage===0?'До конца стирки':'До окончания сушки'}</span><strong>${x.done?fmtClock(x.finishedAt):s.remaining}</strong></div><div class="info"><span>Начало</span><span>${fmtDT(x.startedAt)}</span></div><div class="info"><span>Ориентировочно сухое</span><span>${fmtClock(de)}</span></div><div class="info"><span>Ткань · отжим</span><span>${esc(fabricName(x.fabric))} · ${esc(spinName(x.spin))}</span></div>${x.notes?`<div class="info"><span>Заметка</span><span>${esc(x.notes)}</span></div>`:''}<div class="actions">${history?`<button class="action" data-action="restore" data-id="${x.id}">Вернуть</button>`:`<button class="action" data-action="editLoad" data-id="${x.id}">Изменить</button>${!x.done?`<button class="action primary" data-action="finishLoad" data-id="${x.id}">Готово ✓</button>`:''}`}<button class="action pink" data-action="deleteLoad" data-id="${x.id}">Удалить</button></div></div>`}

function renderHome(){
 let active=loads.filter(x=>!x.done).sort((a,b)=>a.startedAt-b.startedAt),todayTasks=tasks.filter(x=>x.date===today()).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),safe=budgetSafe(),daily=budgetDaily();
 return `<div class="hero-mini"><h2>${settings.name?`Привет, ${esc(settings.name)}! ♡`:'Привет! ♡'}</h2><p>${todayTasks.filter(x=>!x.done).length?`На сегодня запланировано ${todayTasks.filter(x=>!x.done).length} ${taskWord(todayTasks.filter(x=>!x.done).length)}.`:'Сегодня пока ничего не запланировано — можно выдохнуть.'}</p></div>
 <div class="summary-grid"><div class="summary"><div class="lbl">Задач сегодня</div><div class="num">${todayTasks.length}</div></div><div class="summary"><div class="lbl">Можно тратить сегодня</div><div class="num">${money(daily)}</div></div></div>
 <div class="section-head"><h2>Сушится / стирается</h2><span class="counter">${active.filter(x=>stage(x).stage===1).length}</span></div>

 <div class="section-caption">Твои текущие загрузки.</div>${active.length?active.map(loadCard).join(''):`<div class="card empty"><div class="empty-icon">🧺</div><div class="empty-title">Пока здесь пусто</div><div style="margin-top:5px">Добавь первую стирку — будем следить за ней вместе ♡</div></div>`}
 <button class="add-button" data-action="addLoad">＋ Добавить стирку</button>
 ${todayTasks.length?`<div class="card"><h3 style="margin:0 0 5px">📋 Сегодня</h3>${todayTasks.slice(0,4).map(taskMini).join('')}<button class="settings-action" data-page-go="plan">Открыть план дня</button></div>`:''}
 <div class="notice">💡 Время сушки ориентировочное. На него влияют ткань, отжим, количество белья, температура и влажность.</div>`;
}
function taskWord(n){let m=n%10,h=n%100;return m===1&&h!==11?'задача':m>=2&&m<=4&&(h<10||h>=20)?'задачи':'задач'}
function taskMini(t){return `<div class="task ${t.done?'done':''}"><button class="task-check ${t.done?'done':''}" data-action="toggleTask" data-id="${t.id}">${t.done?'✓':''}</button><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-time">${t.time||'Без времени'} · ${durLabel(t.duration)}</div></div></div>`}

function renderLaundry(){let a=loads.filter(x=>!x.done).sort((x,y)=>x.startedAt-y.startedAt);return `<h2 class="page-title">Мои стирки 🧺</h2><p class="section-caption">Можно вести несколько загрузок одновременно.</p><div class="card"><div class="settings-label">Машинки</div>${machines.map(m=>`<span class="machine-chip">${esc(m)}</span>`).join('')}</div>${a.length?a.map(loadCard).join(''):`<div class="card empty"><div class="empty-icon">🫧</div><div class="empty-title">Активных стирок пока нет</div></div>`}<button class="add-button" data-action="addLoad">＋ Добавить стирку</button>`}
function renderHistory(){let a=loads.filter(x=>x.done).sort((x,y)=>(y.finishedAt||0)-(x.finishedAt||0));return `<h2 class="page-title">История стирок 🕊️</h2><p class="section-caption">Завершённые загрузки сохраняются здесь.</p><div class="card"><div class="settings-row"><div><div class="settings-label">Всего завершено</div></div><span class="counter">${a.length}</span></div>${a.length?`<button class="settings-action" data-action="clearHistory">Очистить историю</button>`:''}</div>${a.length?a.map(x=>loadCard(x,true)).join(''):`<div class="card empty"><div class="empty-icon">🕊️</div><div class="empty-title">История пока пустая</div></div>`}`}

function durLabel(n){n=Number(n)||0;if(n<60)return n+' мин';let h=Math.floor(n/60),r=n%60;return r?h+' ч '+r+' мин':h+' ч'}
function renderPlan(){let d=today(),a=tasks.filter(x=>x.date===d).sort((x,y)=>(x.time||'99:99').localeCompare(y.time||'99:99')),future=tasks.filter(x=>x.date>d).sort((x,y)=>(x.date+y.time).localeCompare(y.date+x.time));return `<h2 class="page-title">План дня 📋</h2><p class="section-caption">Ты сама выстраиваешь день: задача, дата, время и длительность.</p><button class="add-button" data-action="addTask">＋ Добавить задачу</button><div class="card"><h3 style="margin:0 0 5px">Сегодня · ${fmtDate(d)}</h3>${a.length?a.map(taskRow).join(''):`<div class="empty" style="padding:22px 5px">На сегодня задач нет ✨</div>`}</div>${future.length?`<div class="card"><h3 style="margin:0 0 5px">Дальше</h3>${future.map(taskRow).join('')}</div>`:''}`}
function taskRow(t){return `<div class="task ${t.done?'done':''}"><button class="task-check ${t.done?'done':''}" data-action="toggleTask" data-id="${t.id}">${t.done?'✓':''}</button><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-time">${fmtDate(t.date)} · ${t.time||'без времени'} · ${durLabel(t.duration)}${t.category?' · '+esc(t.category):''}</div></div><div class="task-actions"><button data-action="editTask" data-id="${t.id}">✎</button><button data-action="deleteTask" data-id="${t.id}">×</button></div></div>`}

function renderBudget(){
 let total=budget.accounts.reduce((s,a)=>s+num(a.balance),0),unpaid=budget.mandatory.filter(x=>!x.paid).reduce((s,x)=>s+num(x.amount),0),daily=budgetDaily(),month=today().slice(0,7),inc=budget.transactions.filter(x=>x.date?.startsWith(month)&&x.type==='income').reduce((s,x)=>s+num(x.amount),0),exp=budget.transactions.filter(x=>x.date?.startsWith(month)&&x.type==='expense').reduce((s,x)=>s+num(x.amount),0);
 return `<h2 class="page-title">Бюджет 💰</h2><p class="section-caption">Счета — это реальные текущие суммы. Доходы и расходы сохраняются отдельно для истории.</p>
 <div class="summary-grid"><div class="summary"><div class="lbl">Сейчас всего</div><div class="num">${money(total)}</div></div><div class="summary"><div class="lbl">После обязательных</div><div class="num">${money(total-unpaid)}</div></div><div class="summary"><div class="lbl">Доходы за месяц</div><div class="num">${money(inc)}</div></div><div class="summary"><div class="lbl">Расходы за месяц</div><div class="num">${money(exp)}</div></div></div>
 <div class="hero-mini"><h2>💸 Можно тратить сегодня: ${money(daily)}</h2><p>Сумма после вычета неоплаченных обязательных платежей, разделённая на оставшиеся дни месяца.</p></div>
 <div class="card"><h3 style="margin:0 0 5px">🏦 Счета и карты</h3>${budget.accounts.length?budget.accounts.map(accountRow).join(''):`<div class="empty" style="padding:20px 5px">Добавь первую карту или счёт.</div>`}<button class="settings-action" data-action="addAccount">＋ Добавить счёт / карту</button></div>
 <div class="card"><h3 style="margin:0 0 5px">Операции</h3><button class="settings-action" data-action="addIncome">＋ Добавить доход</button><button class="settings-action" data-action="addExpense">− Добавить расход</button>${renderTransactions()}</div>
 <div class="card"><h3 style="margin:0 0 5px">📌 Обязательные платежи</h3>${budget.mandatory.length?budget.mandatory.map(mandatoryRow).join(''):`<div class="small-note" style="margin-top:8px">Например: аренда, интернет, кредит или коммуналка.</div>`}<button class="settings-action" data-action="addMandatory">＋ Добавить обязательный платёж</button></div>`;
}
function accountRow(a){return `<div class="account"><div><div class="account-name">${esc(a.name)}</div><div class="small-note">Счёт / карта</div></div><div style="text-align:right"><div class="money">${money(a.balance)}</div><div><button class="action" data-action="editAccount" data-id="${a.id}">Изменить</button> <button class="action pink" data-action="deleteAccount" data-id="${a.id}">×</button></div></div></div>`}
function renderTransactions(){let a=[...budget.transactions].sort((x,y)=>(y.date||'').localeCompare(x.date||'')).slice(0,12);if(!a.length)return `<div class="small-note" style="margin-top:12px">Операций пока нет.</div>`;return a.map(x=>{let ac=budget.accounts.find(a=>a.id===x.accountId);return `<div class="account"><div><div class="account-name">${esc(x.name)}</div><div class="small-note">${fmtDate(x.date)} · ${esc(ac?.name||'Счёт удалён')}</div></div><div class="money ${x.type==='income'?'positive':'negative'}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`}).join('')}
function mandatoryRow(x){let ac=budget.accounts.find(a=>a.id===x.accountId);return `<div class="account"><div><div class="account-name">${esc(x.name)}</div><div class="small-note">до ${fmtDate(x.date)} · ${esc(ac?.name||'без счёта')}</div></div><div style="text-align:right"><div class="money">${money(x.amount)}</div><button class="action ${x.paid?'primary':''}" data-action="toggleMandatory" data-id="${x.id}">${x.paid?'Оплачено ✓':'Оплатить'}</button> <button class="action pink" data-action="deleteMandatory" data-id="${x.id}">×</button></div></div>`}
function budgetSafe(){return budget.accounts.reduce((s,a)=>s+num(a.balance),0)-budget.mandatory.filter(x=>!x.paid).reduce((s,x)=>s+num(x.amount),0)}
function budgetDaily(){let now=new Date(),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;return Math.max(0,budgetSafe()/Math.max(1,days))}

function renderSettings(){return `<h2 class="page-title">Настройки ⚙️</h2><p class="section-caption">Настрой приложение под себя. Всё хранится на этом устройстве.</p>
<div class="card"><h3 style="margin:0 0 5px">♡ Профиль</h3><label>Как тебя называть?</label><input id="profileName" maxlength="40" placeholder="Твоё имя" value="${esc(settings.name||'')}"><button class="settings-action" data-action="saveProfile">Сохранить имя</button></div>
<div class="card"><h3 style="margin:0 0 5px">🎨 Оформление</h3><div class="settings-row"><div><div class="settings-label">Тема</div><div class="settings-help">Выбирай настроение приложения.</div></div><select id="settingTheme"><option value="sage" ${settings.theme==='sage'?'selected':''}>Шалфейная</option><option value="pink" ${settings.theme==='pink'?'selected':''}>Розовая</option><option value="lilac" ${settings.theme==='lilac'?'selected':''}>Сиреневая</option><option value="dark" ${settings.theme==='dark'?'selected':''}>Тёмная</option></select></div>
<div class="settings-row"><div><div class="settings-label">Формат времени</div></div><select id="settingTime"><option value="24" ${settings.timeFormat==='24'?'selected':''}>24 часа</option><option value="12" ${settings.timeFormat==='12'?'selected':''}>12 часов</option></select></div>
<div class="settings-row"><div><div class="settings-label">Показывать погоду</div><div class="settings-help">Погода помогает оценить сушку.</div></div><input id="settingWeather" type="checkbox" ${settings.showWeather?'checked':''}></div></div>
<div class="card"><h3 style="margin:0 0 5px">🧺 Машинки</h3>${machines.map((m,i)=>`<div class="settings-row"><div><div class="settings-label">${esc(m)}</div><div class="settings-help">${loads.filter(x=>x.machine===m&&!x.done).length} активных</div></div><button class="action pink" data-action="removeMachine" data-index="${i}" ${machines.length===1?'disabled':''}>Удалить</button></div>`).join('')}<button class="settings-action" data-action="addMachine">＋ Добавить машинку</button><div class="settings-row"><div><div class="settings-label">По умолчанию</div></div><select id="defaultMachine">${machineOptions(settings.defaultMachine)}</select></div></div>
<div class="card"><h3 style="margin:0 0 5px">💾 Данные</h3><div class="small-note">Теперь резервная копия включает стирки, профиль, план и бюджет.</div><button class="settings-action" data-action="openHistory">🕊️ История стирок</button>
<button class="settings-action" data-action="exportData">Экспортировать резервную копию</button><button class="settings-action" data-action="importData">Импортировать резервную копию</button><input class="hidden" id="importFile" type="file" accept="application/json,.json"><button class="settings-action" data-action="resetSettings">Сбросить настройки</button></div>
<div class="card"><h3 style="margin:0 0 5px">♡ О проекте</h3><div class="small-note">«Бельё дома» — уютный помощник для дома, стирки, планов и бюджета.</div><div class="small-note" style="margin-top:10px">Версия 3.0 · профиль + план дня + бюджет</div></div>`}

document.addEventListener('click',async e=>{
  let nav=e.target.closest('.nav-button');
  if(nav){
    currentPage=nav.dataset.page;
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  let pg=e.target.closest('[data-page-go]');
  if(pg){
    currentPage=pg.dataset.pageGo;
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  let b=e.target.closest('[data-action]');
  if(!b)return;

  let a=b.dataset.action;
  let id=b.dataset.id;

  if(a==='open-plan'){
    currentPage='plan';
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='open-laundry'){
    currentPage='laundry';
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='open-budget'){
    currentPage='budget';
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='open-pet'){
    currentPage='pet';
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='open-settings'){
    currentPage='settings';
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='history'){
    currentPage='history';
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='back'){
    currentPage='home';
    editingId=null;
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='new-laundry'){
    editingId=null;
    currentPage='laundry';
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='edit-laundry'){
    editingId=id;
    currentPage='laundry';
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='delete-laundry'){
    if(!confirm('Удалить эту стирку?'))return;
    laundries=laundries.filter(x=>x.id!==id);
    saveAll();
    render();
    toast('Стирка удалена');
    return
  }

  if(a==='finish-laundry'){
    let x=laundries.find(x=>x.id===id);
    if(x){
      x.status='done';
      x.finishedAt=new Date().toISOString();
      saveAll();
      render();
      toast('Стирка завершена 🧺');
    }
    return
  }

  if(a==='cancel-laundry'){
    let x=laundries.find(x=>x.id===id);
    if(x){
      x.status='cancelled';
      saveAll();
      render();
      toast('Стирка отменена');
    }
    return
  }

  if(a==='new-task'){
    editingId=null;
    currentPage='plan';
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='edit-task'){
    editingId=id;
    currentPage='plan';
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='delete-task'){
    if(!confirm('Удалить задачу?'))return;
    tasks=tasks.filter(x=>x.id!==id);
    saveAll();
    render();
    toast('Задача удалена');
    return
  }

  if(a==='toggle-task'){
    let x=tasks.find(x=>x.id===id);
    if(x){
      x.done=!x.done;
      saveAll();
      render();
    }
    return
  }

  if(a==='new-income'){
    editingId=null;
    currentPage='budget';
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='new-expense'){
    editingId=null;
    currentPage='budget';
    render();
    window.scrollTo(0,0);
    return
  }

  if(a==='delete-income'){
    if(!confirm('Удалить доход?'))return;
    budget.incomes=budget.incomes.filter(x=>x.id!==id);
    saveAll();
    render();
    toast('Доход удалён');
    return
  }

  if(a==='delete-expense'){
    if(!confirm('Удалить расход?'))return;
    budget.expenses=budget.expenses.filter(x=>x.id!==id);
    saveAll();
    render();
    toast('Расход удалён');
    return
  }

  if(a==='delete-account'){
    if(!confirm('Удалить этот счёт?'))return;
    budget.accounts=budget.accounts.filter(x=>x.id!==id);
    saveAll();
    render();
    toast('Счёт удалён');
    return
  }

  if(a==='delete-machine'){
    if(!confirm('Удалить стиральную машину?'))return;
    machines=machines.filter(x=>x.id!==id);
    saveAll();
    render();
    toast('Машина удалена');
    return
  }

  if(a==='theme'){
    let t=b.dataset.theme;
    if(t){
      settings.theme=t;
      saveAll();
      applyTheme();
      render();
    }
    return
  }

  if(a==='export'){
    let data={
      settings,
      laundries,
      tasks,
      budget,
      machines,
      profile,
      exportedAt:new Date().toISOString()
    };

    let blob=new Blob(
      [JSON.stringify(data,null,2)],
      {type:'application/json'}
    );

    let url=URL.createObjectURL(blob);
    let link=document.createElement('a');
    link.href=url;
    link.download='belyo-doma-backup.json';
    link.click();
    URL.revokeObjectURL(url);
    toast('Резервная копия создана 💾');
    return
  }

  if(a==='import'){
    let input=document.createElement('input');
    input.type='file';
    input.accept='.json,application/json';

    input.onchange=async()=>{
      let file=input.files?.[0];
      if(!file)return;

      try{
        let text=await file.text();
        let d=JSON.parse(text);

        if(d.settings)settings={...settings,...d.settings};
        if(Array.isArray(d.laundries))laundries=d.laundries;
        if(Array.isArray(d.tasks))tasks=d.tasks;
        if(d.budget)budget={...budget,...d.budget};
        if(Array.isArray(d.machines))machines=d.machines;
        if(d.profile)profile={...profile,...d.profile};

        saveAll();
        applyTheme();
        render();
        toast('Резервная копия восстановлена ✨');
      }catch(e){
        toast('Не удалось прочитать копию');
      }
    };

    input.click();
    return
  }
});

$('refreshWeather').addEventListener('click',weatherLoad);

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    loadSaved();
    render();
  }
});

loadSaved();
render();
weatherLoad();

// Перерисовка по таймеру отключена: открытые формы не должны сбрасываться.
</script>
</body>
