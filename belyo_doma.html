<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e9">
<title>Бельё дома</title>

<style>
:root{
  --cream:#f7f1e9;
  --milk:#fffaf5;
  --sage:#91a58f;
  --sage-dark:#60745f;
  --sage-light:#dce6d9;
  --pink:#e9b9c4;
  --pink-light:#f7dfe4;
  --brown:#594e48;
  --muted:#8d827b;
  --white:#ffffff;
  --shadow:0 10px 30px rgba(92,77,67,.10);
  --radius:24px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--cream);
  color:var(--brown);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding-bottom:95px;
}

header{
  padding:28px 20px 12px;
}

.eyebrow{
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--sage-dark);
  font-weight:700;
}

h1{
  margin:5px 0 0;
  font-size:32px;
  line-height:1.1;
}

.subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-size:15px;
}

.card{
  background:rgba(255,250,245,.9);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin:14px 16px;
  padding:18px;
}

.weather{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--sage-light);
}

.weather-main{
  display:flex;
  align-items:center;
  gap:12px;
}

.weather-icon{
  font-size:34px;
}

.weather-temp{
  font-size:24px;
  font-weight:800;
}

.weather-text{
  font-size:13px;
  color:var(--sage-dark);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 20px 10px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.laundry-card{
  position:relative;
  overflow:hidden;
}

.laundry-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.laundry-name{
  font-size:18px;
  font-weight:750;
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  background:var(--pink-light);
  color:#9c6370;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.progress{
  height:9px;
  background:#eee5dc;
  border-radius:99px;
  overflow:hidden;
  margin:16px 0 10px;
}

.progress-bar{
  height:100%;
  background:var(--sage);
  border-radius:99px;
  transition:width .3s ease;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.action{
  flex:1;
  padding:11px 8px;
  border-radius:14px;
  background:#f1ebe4;
  color:var(--brown);
  font-size:13px;
  font-weight:650;
}

.action.primary{
  background:var(--sage);
  color:white;
}

.action.danger{
  background:#f5dede;
  color:#a65e68;
}

.add-button{
  width:calc(100% - 32px);
  margin:18px 16px;
  padding:17px;
  border-radius:20px;
  background:var(--sage-dark);
  color:white;
  font-size:16px;
  font-weight:750;
  box-shadow:0 10px 20px rgba(96,116,95,.2);
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:13px;
  font-weight:700;
  color:var(--sage-dark);
}

input,select{
  width:100%;
  border:1px solid #e7ddd4;
  background:white;
  color:var(--brown);
  border-radius:15px;
  padding:13px 14px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--sage);
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.form-buttons button{
  flex:1;
  padding:14px;
  border-radius:16px;
  font-weight:700;
}

.save{
  background:var(--sage);
  color:white;
}

.cancel{
  background:#eee7df;
  color:var(--brown);
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:min(490px,calc(100% - 24px));
  display:flex;
  justify-content:space-around;
  padding:10px 6px;
  background:rgba(255,250,245,.94);
  backdrop-filter:blur(18px);
  border:1px solid rgba(120,100,90,.08);
  border-radius:22px;
  box-shadow:0 8px 30px rgba(70,55,45,.14);
  z-index:20;
}

.nav-btn{
  background:transparent;
  color:var(--muted);
  padding:7px 12px;
  border-radius:14px;
  font-size:11px;
  text-align:center;
}

.nav-btn span{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.nav-btn.active{
  color:var(--sage-dark);
  background:var(--sage-light);
}

.notice{
  margin:12px 20px;
  padding:12px 14px;
  border-radius:16px;
  background:#fff4df;
  color:#8b7352;
  font-size:12px;
  line-height:1.45;
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#594e48;
  color:white;
  padding:12px 18px;
  border-radius:14px;
  font-size:13px;
  z-index:50;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
 </style>
</head>

<body>

<div class="app">

<header>
  <div class="eyebrow">Бельё дома ♡</div>
  <h1>Привет! 🧺</h1>
  <p class="subtitle">Посмотрим, что сейчас сушится?</p>
</header>

<div class="card weather">
  <div class="weather-main">
    <div class="weather-icon" id="weatherIcon">☁️</div>
    <div>
      <div class="weather-temp" id="weatherTemp">—°</div>
      <div class="weather-text" id="weatherText">Загружаем погоду…</div>
    </div>
  </div>
  <button class="action" onclick="loadWeather()">↻</button>
</div>

<div id="homePage">

  <div class="section-title">
    <h2>Сейчас сушится</h2>
    <span id="laundryCount"></span>
  </div>

  <div id="laundryList"></div>

  <button class="add-button" onclick="openForm()">
    ＋ Добавить стирку
  </button>

</div>

<div class="card form" id="laundryForm">

  <div class="section-title" style="margin:0 0 8px">
    <h2 id="formTitle">Новая стирка</h2>
  </div>

  <label>Название</label>
  <input id="name" type="text" placeholder="Например, постельное бельё">

  <label>Стирка</label>
  <select id="duration">
    <option value="45">45 минут</option>
    <option value="60" selected>1 час</option>
    <option value="90">1,5 часа</option>
    <option value="120">2 часа</option>
    <option value="150">2,5 часа</option>
    <option value="180">3 часа</option>
  </select>

  <label>Ткань</label>
  <select id="fabric">
    <option value="cotton">Хлопок</option>
    <option value="synthetic">Синтетика</option>
    <option value="mixed" selected>Смешанная</option>
    <option value="delicate">Деликатная</option>
    <option value="towel">Полотенца</option>
    <option value="bed">Постельное бельё</option>
  </select>

  <label>Отжим</label>
  <select id="spin">
    <option value="low">Низкий</option>
    <option value="medium" selected>Средний</option>
    <option value="high">Высокий</option>
  </select>

  <label>Где сушим?</label>
  <select id="place">
    <option value="balcony" selected>Балкон</option>
    <option value="glazed">Застеклённый балкон</option>
    <option value="radiator">Батарея</option>
    <option value="room">В комнате</option>
  </select>

  <label>Количество белья</label>
  <select id="amount">
    <option value="small">Немного</option>
    <option value="medium" selected>Средняя загрузка</option>
    <option value="large">Много</option>
  </select>

  <label>Воздух</label>
  <select id="air">
    <option value="still">Почти нет движения воздуха</option>
    <option value="normal" selected>Обычный</option>
    <option value="windy">Хорошо проветривается</option>
  </select>

  <label>Когда началась стирка?</label>
  <select id="startMode" onchange="toggleCustomStart()">
    <option value="now" selected>Сейчас</option>
    <option value="custom">Указать время</option>
  </select>

  <input id="customStart" type="datetime-local" style="display:none">

  <div class="form-buttons">
    <button class="cancel" onclick="closeForm()">Отмена</button>
    <button class="save" onclick="saveLaundry()">Сохранить</button>
  </div>

</div>

<div class="notice">
  💡 Время сушки — это ориентировочный расчёт. На него влияют влажность,
  температура, вентиляция, количество белья и материал ткани.
</div>

</div>

<nav class="bottom-nav">

  <button class="nav-btn active" onclick="showHome(this)">
    <span>🏠</span>
    Главная
  </button>

  <button class="nav-btn" onclick="openForm();setNav(this)">
    <span>🧺</span>
    Стирки
  </button>

  <button class="nav-btn" onclick="showHistory(this)">
    <span>🕊️</span>
    История
  </button>

  <button class="nav-btn" onclick="showSettings(this)">
    <span>⚙️</span>
    Настройки
  </button>

</nav>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "belyo_doma_v2";

let laundry = [];
let editingId = null;
let weather = {
  temp: null,
  humidity: null,
  description: "Погода пока неизвестна"
};

const $ = id => document.getElementById(id);

function loadData(){
  try{
    laundry = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){
    laundry = [];
  }

  render();
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(laundry));
}

function toast(message){
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function openForm(){
  $("homePage").style.display = "none";
  $("laundryForm").classList.add("active");

  if(!editingId){
    $("formTitle").textContent = "Новая стирка";
  }
}

function closeForm(){
  editingId = null;
  $("laundryForm").classList.remove("active");
  $("homePage").style.display = "block";
  resetForm();
}

function resetForm(){
  $("name").value = "";
  $("duration").value = "60";
  $("fabric").value = "mixed";
  $("spin").value = "medium";
  $("place").value = "balcony";
  $("amount").value = "medium";
  $("air").value = "normal";
  $("startMode").value = "now";
  $("customStart").style.display = "none";
  $("customStart").value = "";
}

function toggleCustomStart(){
  $("customStart").style.display =
    $("startMode").value === "custom" ? "block" : "none";
}

function getStartTime(){
  if($("startMode").value === "custom"){
    const value = $("customStart").value;

    if(value){
      const date = new Date(value);
      if(!isNaN(date.getTime())) return date.getTime();
    }
  }

  return Date.now();
}

function calculateDrying(item){
  let minutes = 150;

  const fabric = {
    cotton: 165,
    synthetic: 100,
    mixed: 135,
    delicate: 115,
    towel: 190,
    bed: 180
  };

  minutes = fabric[item.fabric] || 150;

  if(item.spin === "low") minutes += 35;
  if(item.spin === "high") minutes -= 20;

  if(item.amount === "small") minutes -= 20;
  if(item.amount === "large") minutes += 35;

  if(item.air === "windy") minutes -= 30;
  if(item.air === "still") minutes += 25;

  if(item.place === "glazed") minutes += 10;
  if(item.place === "radiator") minutes -= 25;
  if(item.place === "room") minutes += 30;

  if(weather.humidity !== null){
    if(weather.humidity >= 80) minutes += 35;
    else if(weather.humidity >= 65) minutes += 20;
    else if(weather.humidity <= 40) minutes -= 15;
  }

  if(weather.temp !== null){
    if(weather.temp < 5) minutes += 25;
    else if(weather.temp > 25) minutes -= 15;
  }

  return Math.max(45, Math.round(minutes / 5) * 5);
}

function saveLaundry(){
  const name = $("name").value.trim() || "Моя стирка";

  const item = {
    id: editingId || Date.now().toString(),
    name,
    duration: Number($("duration").value),
    fabric: $("fabric").value,
    spin: $("spin").value,
    place: $("place").value,
    amount: $("amount").value,
    air: $("air").value,
    startedAt: getStartTime(),
    stage: "washing",
    createdAt: Date.now()
  };

  if(editingId){
    const index = laundry.findIndex(x => x.id === editingId);

    if(index !== -1){
      item.createdAt = laundry[index].createdAt;
      laundry[index] = item;
    }
  }else{
    laundry.unshift(item);
  }

  saveData();

  editingId = null;
  closeForm();

  render();

  toast("Стирка добавлена 🧺");
}

function editLaundry(id){
  const item = laundry.find(x => x.id === id);
  if(!item) return;

  editingId = id;

  $("formTitle").textContent = "Изменить стирку";
  $("name").value = item.name;
  $("duration").value = item.duration;
  $("fabric").value = item.fabric;
  $("spin").value = item.spin;
  $("place").value = item.place;
  $("amount").value = item.amount;
  $("air").value = item.air;

  openForm();
}

function deleteLaundry(id){
  if(!confirm("Удалить эту стирку?")) return;

  laundry = laundry.filter(x => x.id !== id);

  saveData();
  render();

  toast("Стирка удалена");
}

function markDry(id){
  const item = laundry.find(x => x.id === id);
  if(!item) return;

  item.stage = "done";
  item.finishedAt = Date.now();

  saveData();
  render();

  toast("Бельё отмечено как сухое ✨");
}

function getStage(item){
  const now = Date.now();
  const washEnd = item.startedAt + item.duration * 60000;

  if(item.stage === "done"){
    return {
      title:"Готово ✨",
      progress:100,
      remaining:"Высохло"
    };
  }

  if(now < washEnd){
    const progress = Math.min(
      99,
      Math.max(
        1,
        Math.round((now - item.startedAt) / (item.duration * 60000) * 100)
      )
    );

    return {
      title:"Стирается",
      progress,
      remaining:formatRemaining(washEnd - now)
    };
  }

  const dryMinutes = calculateDrying(item);
  const dryEnd = washEnd + dryMinutes * 60000;

  if(now < dryEnd){
    const total = dryEnd - washEnd;
    const passed = now - washEnd;

    return {
      title:"Сушится",
      progress:Math.min(
        99,
        Math.max(1,Math.round(passed / total * 100))
      ),
      remaining:formatRemaining(dryEnd - now)
    };
  }

  return {
    title:"Возможно, уже сухо",
    progress:100,
    remaining:"Пора проверить"
  };
}

function formatRemaining(ms){
  if(ms <= 0) return "сейчас";

  const minutes = Math.ceil(ms / 60000);

  if(minutes < 60){
    return `${minutes} мин`;
  }

  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;

  if(mins === 0){
    return `${hours} ч`;
  }

  return `${hours} ч ${mins} мин`;
}

function placeName(place){
  return {
    balcony:"Балкон",
    glazed:"Застеклённый балкон",
    radiator:"Батарея",
    room:"Комната"
  }[place] || place;
}

function render(){
  const list = $("laundryList");

  $("laundryCount").textContent =
    laundry.length ? `${laundry.length}` : "";

  if(!laundry.length){
    list.innerHTML = `
      <div class="card empty">
        <div style="font-size:42px">🧺</div>
        <div style="margin-top:10px;font-weight:700">
          Пока здесь пусто
        </div>
        <div style="margin-top:5px">
          Добавь первую стирку — будем следить за ней вместе ♡
        </div>
      </div>
    `;

    return;
  }

  list.innerHTML = laundry.map(item=>{
    const stage = getStage(item);

    return `
      <div class="card laundry-card">

        <div class="laundry-top">
          <div>
            <div class="laundry-name">
              ${escapeHtml(item.name)}
            </div>

            <div class="info-row" style="margin-top:5px">
              ${placeName(item.place)}
            </div>
          </div>

          <div class="badge">
            ${stage.title}
          </div>
        </div>

        <div class="progress">
          <div
            class="progress-bar"
            style="width:${stage.progress}%"
          ></div>
        </div>

        <div class="info-row">
          <span>Осталось</span>
          <strong>${stage.remaining}</strong>
        </div>

        <div class="info-row" style="margin-top:6px">
          <span>Ткань</span>
          <span>${fabricName(item.fabric)}</span>
        </div>

        <div class="actions">
          <button
            class="action"
            onclick="editLaundry('${item.id}')">
            Изменить
          </button>

          ${
            stage.progress >= 100 && item.stage !== "done"
            ? `
              <button
                class="action primary"
                onclick="markDry('${item.id}')">
                Сухо ✓
              </button>
            `
            : ""
          }

          <button
            class="action danger"
            onclick="deleteLaundry('${item.id}')">
            Удалить
          </button>
        </div>

      </div>
    `;
  }).join("");
}

function fabricName(value){
  return {
    cotton:"Хлопок",
    synthetic:"Синтетика",
    mixed:"Смешанная",
    delicate:"Деликатная",
    towel:"Полотенца",
    bed:"Постельное бельё"
  }[value] || value;
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
 <script>
function showHome(button){
  $("homePage").style.display = "block";
  $("laundryForm").classList.remove("active");

  document.querySelectorAll(".nav-btn")
    .forEach(btn => btn.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }
}

function setNav(button){
  document.querySelectorAll(".nav-btn")
    .forEach(btn => btn.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }
}

function showHistory(button){
  setNav(button);

  const completed = laundry.filter(
    item => item.stage === "done"
  );

  if(!completed.length){
    toast("История пока пустая 🕊️");
    return;
  }

  toast(`В истории ${completed.length} стирок`);
}

function showSettings(button){
  setNav(button);

  toast("Настройки скоро появятся ⚙️");
}

async function loadWeather(){
  $("weatherText").textContent = "Обновляем погоду…";

  try{
    let latitude = 55.79;
    let longitude = 42.74;

    if(navigator.geolocation){
      try{
        const position = await new Promise((resolve,reject)=>{
          navigator.geolocation.getCurrentPosition(
            resolve,
            reject,
            {
              enableHighAccuracy:false,
              timeout:4000,
              maximumAge:600000
            }
          );
        });

        latitude = position.coords.latitude;
        longitude = position.coords.longitude;
      }catch(e){
        // Используем резервные координаты
      }
    }

    const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${latitude}` +
      `&longitude=${longitude}` +
      `&current=temperature_2m,relative_humidity_2m,weather_code` +
      `&timezone=auto`;

    const response = await fetch(url);
    const data = await response.json();

    weather.temp =
      Math.round(data.current.temperature_2m);

    weather.humidity =
      data.current.relative_humidity_2m;

    const code = data.current.weather_code;

    const weatherInfo = getWeatherInfo(code);

    $("weatherIcon").textContent = weatherInfo.icon;

    $("weatherTemp").textContent =
      `${weather.temp > 0 ? "+" : ""}${weather.temp}°`;

    $("weatherText").textContent =
      `${weatherInfo.text} · влажность ${weather.humidity}%`;

    render();

  }catch(error){

    $("weatherIcon").textContent = "🌤️";
    $("weatherTemp").textContent = "—°";
    $("weatherText").textContent =
      "Не удалось получить погоду";

  }
}

function getWeatherInfo(code){

  if(code === 0){
    return {
      icon:"☀️",
      text:"Ясно"
    };
  }

  if([1,2,3].includes(code)){
    return {
      icon:"🌤️",
      text:"Облачно"
    };
  }

  if([45,48].includes(code)){
    return {
      icon:"🌫️",
      text:"Туман"
    };
  }

  if([51,53,55,56,57].includes(code)){
    return {
      icon:"🌦️",
      text:"Морось"
    };
  }

  if([61,63,65,66,67].includes(code)){
    return {
      icon:"🌧️",
      text:"Дождь"
    };
  }

  if([71,73,75,77].includes(code)){
    return {
      icon:"🌨️",
      text:"Снег"
    };
  }

  if([80,81,82].includes(code)){
    return {
      icon:"🌦️",
      text:"Ливень"
    };
  }

  if([95,96,99].includes(code)){
    return {
      icon:"⛈️",
      text:"Гроза"
    };
  }

  return {
    icon:"☁️",
    text:"Погода"
  };
}

function requestNotifications(){

  if(!("Notification" in window)){
    toast("Уведомления не поддерживаются");
    return;
  }

  Notification.requestPermission()
    .then(permission=>{

      if(permission === "granted"){
        toast("Уведомления разрешены 🔔");
      }else{
        toast("Уведомления отключены");
      }

    });
}

function checkNotifications(){

  if(
    !("Notification" in window) ||
    Notification.permission !== "granted"
  ){
    return;
  }

  laundry.forEach(item=>{

    if(item.stage === "done") return;

    const stage = getStage(item);

    if(
      stage.title === "Сушится" &&
      stage.progress >= 100 &&
      !item.notified
    ){

      try{
        new Notification(
          "Бельё дома 🧺",
          {
            body:`Похоже, «${item.name}» уже можно проверить.`
          }
        );

        item.notified = true;
        saveData();

      }catch(e){}
    }

  });
}

function updateStages(){

  render();
  checkNotifications();

}

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(!document.hidden){
      loadData();
      loadWeather();
    }
  }
);

setInterval(
  updateStages,
  30000
);

loadData();
loadWeather();

</script>
