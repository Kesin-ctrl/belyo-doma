<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f3ee">
<title>Бельё дома — стирка и сушка</title>

<style>
:root{
  --sage:#8fa996;
  --sage-dark:#637d6b;
  --sage-soft:#e9f0e9;
  --pink:#e9b8c7;
  --pink-soft:#f9e9ee;
  --cream:#f8f3ee;
  --cream-2:#fffaf7;
  --ink:#30352f;
  --muted:#7d837d;
  --line:#e7e4df;
  --white:#fff;
  --shadow:0 12px 32px rgba(82,92,78,.10);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#faf6f2,#f5f1ed);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body.theme-pink{
  --sage:#d99aaf;
  --sage-dark:#a96f83;
  --sage-soft:#f8e5ec;
  --pink:#e9b8c7;
  --pink-soft:#f9e9ee;
}
body.theme-lilac{
  --sage:#a99bc9;
  --sage-dark:#7e6e9e;
  --sage-soft:#eee9f7;
  --pink:#d4c3ec;
  --pink-soft:#f1ecf9;
}
body.theme-dark{
  --sage:#8fa996;
  --sage-dark:#536e5c;
  --sage-soft:#36453a;
  --pink:#c993a5;
  --pink-soft:#48333c;
  --cream:#242924;
  --cream-2:#2d332d;
  --ink:#f4f1ec;
  --muted:#b1b8b0;
  --line:#444b44;
  --white:#303730;
  --shadow:0 12px 32px rgba(0,0,0,.18);
  background:#202520;
}
body.theme-dark .card,
body.theme-dark .bottom-nav{background:var(--cream-2)}
body.theme-dark input,
body.theme-dark select{background:#353c35;color:var(--ink)}
body.theme-dark .action,
body.theme-dark .cancel-button{background:#3c443c;color:var(--ink)}
body.theme-dark .notice{background:#3c392e;color:#e8d8b8}

button,input,select{font:inherit}
button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.app{
  width:min(100%,520px);
  margin:auto;
  min-height:100vh;
  padding-bottom:110px;
}
header{padding:28px 18px 14px}
.eyebrow{
  color:var(--sage-dark);
  font-size:12px;
  font-weight:800;
  letter-spacing:1.6px;
  text-transform:uppercase;
}
h1{margin:6px 0 5px;font-size:32px;line-height:1.05}
.subtitle{margin:0;color:var(--muted);font-size:15px}
.card{
  margin:12px 16px;
  padding:17px;
  background:rgba(255,250,247,.94);
  border:1px solid rgba(120,120,110,.07);
  border-radius:24px;
  box-shadow:var(--shadow);
}
.weather-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(135deg,var(--sage-soft),var(--cream-2));
}
.weather-left{display:flex;align-items:center;gap:12px}
.weather-icon{
  width:50px;height:50px;
  display:grid;place-items:center;
  border-radius:17px;
  background:rgba(255,255,255,.65);
  font-size:27px;
}
.weather-temp{font-size:24px;font-weight:850}
.weather-text{margin-top:3px;color:var(--muted);font-size:12px}
.small-button{
  border:0;padding:9px 11px;border-radius:13px;
  background:var(--white);color:var(--sage-dark);font-weight:750;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:24px 18px 9px;gap:10px;
}
.section-head h2{margin:0;font-size:20px}
.counter{
  min-width:27px;padding:5px 9px;border-radius:999px;
  background:var(--pink-soft);color:var(--sage-dark);
  font-size:12px;font-weight:800;text-align:center;
}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:8px}
.empty-title{color:var(--ink);font-size:16px;font-weight:800}
.load-card{position:relative;overflow:hidden}
.load-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.load-name{font-size:18px;font-weight:850;overflow-wrap:anywhere}
.load-place{margin-top:4px;color:var(--muted);font-size:12px}
.badge{
  flex-shrink:0;padding:7px 10px;border-radius:999px;
  background:var(--pink-soft);color:var(--sage-dark);
  font-size:11px;font-weight:850;
}
.progress-wrap{
  height:9px;margin:17px 0 10px;overflow:hidden;
  border-radius:999px;background:var(--line);
}
.progress{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--sage),#b6c9b5);
  transition:width .3s ease;
}
.info{
  display:flex;justify-content:space-between;gap:10px;
  color:var(--muted);font-size:12px;margin-top:6px;
}
.info strong{color:var(--ink)}
.actions{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}
.action{
  flex:1;min-width:75px;border:0;padding:11px 7px;
  border-radius:14px;background:#f0ebe6;color:var(--ink);
  font-size:12px;font-weight:750;
}
.action.primary{background:var(--sage-dark);color:white}
.action.pink{background:var(--pink-soft);color:var(--sage-dark)}
.add-button{
  width:calc(100% - 32px);margin:18px 16px;padding:17px;
  border:0;border-radius:19px;background:var(--sage-dark);
  color:white;font-size:16px;font-weight:850;
  box-shadow:0 10px 24px rgba(99,125,107,.22);
}
.form-card{display:none}
.form-card.active{display:block}
.form-title{margin:0 0 4px;font-size:21px}
.form-subtitle{margin:0 0 17px;color:var(--muted);font-size:12px}
label{
  display:block;margin:14px 0 7px;
  color:var(--sage-dark);font-size:12px;font-weight:800;
}
input,select{
  width:100%;min-height:47px;padding:12px 13px;
  border:1px solid var(--line);border-radius:15px;
  outline:0;background:var(--white);color:var(--ink);
}
input:focus,select:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(143,169,150,.13);
}
.form-buttons{display:flex;gap:9px;margin-top:18px}
.form-buttons button{
  flex:1;padding:14px;border:0;border-radius:15px;font-weight:800;
}
.save-button{background:var(--sage);color:white}
.cancel-button{background:#eee8e2;color:var(--ink)}
.notice{
  margin:14px 18px;padding:13px 14px;border-radius:17px;
  background:#fff5e5;color:#876f50;font-size:11px;line-height:1.5;
}
.bottom-nav{
  position:fixed;z-index:20;left:50%;bottom:10px;
  width:min(490px,calc(100% - 22px));transform:translateX(-50%);
  display:flex;justify-content:space-around;padding:8px 5px;
  border:1px solid rgba(120,120,110,.09);border-radius:23px;
  background:rgba(255,250,247,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 35px rgba(70,60,50,.15);
}
.nav-button{
  flex:1;padding:7px 3px;border:0;border-radius:15px;
  background:transparent;color:var(--muted);
  font-size:10px;font-weight:650;
}
.nav-icon{display:block;margin-bottom:3px;font-size:20px}
.nav-button.active{background:var(--sage-soft);color:var(--sage-dark)}
.toast{
  position:fixed;z-index:50;left:50%;bottom:92px;
  max-width:calc(100% - 40px);padding:12px 17px;
  border-radius:15px;transform:translate(-50%,20px);
  opacity:0;pointer-events:none;background:#3f473f;color:white;
  font-size:12px;text-align:center;transition:.25s ease;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.hidden{display:none!important}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:13px 0;border-bottom:1px solid var(--line);
}
.settings-row:last-child{border-bottom:0}
.settings-label{font-size:14px;font-weight:700}
.settings-help{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}
.settings-row select{width:48%;min-height:42px;padding:8px;font-size:12px}
.settings-row input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--sage-dark)}
.settings-row input[type=text]{width:48%;min-height:42px;padding:8px;font-size:12px}
.settings-action{
  width:100%;margin-top:10px;padding:13px;border:0;
  border-radius:14px;background:var(--sage-soft);
  color:var(--sage-dark);font-weight:800;text-align:left;
}
.page-title{margin:25px 18px 12px;font-size:22px}
.section-caption{margin:0 18px 12px;color:var(--muted);font-size:12px;line-height:1.5}
.machine-chip{
  display:inline-block;margin:5px 5px 0 0;padding:7px 10px;
  border-radius:999px;background:var(--sage-soft);
  color:var(--sage-dark);font-size:11px;font-weight:750;
}
.small-note{font-size:11px;color:var(--muted);line-height:1.5}
@media(max-width:360px){
  h1{font-size:29px}
  .action{font-size:11px;padding:10px 5px}
  .nav-button{font-size:9px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="eyebrow">Бельё дома ♡</div>
  <h1 id="greeting">Привет! 🧺</h1>
  <p class="subtitle" id="subtitle">Посмотрим, что сейчас сушится?</p>
</header>

<div class="card weather-card" id="weatherCard">
  <div class="weather-left">
    <div class="weather-icon" id="weatherIcon">☁️</div>
    <div>
      <div class="weather-temp" id="weatherTemp">—°</div>
      <div class="weather-text" id="weatherText">Загружаем погоду…</div>
    </div>
  </div>
  <button class="small-button" id="refreshWeather" aria-label="Обновить погоду">↻</button>
</div>

<main id="pageContent"></main>

<nav class="bottom-nav">
  <button class="nav-button active" data-page="home">
    <span class="nav-icon">🏠</span>Главная
  </button>
  <button class="nav-button" data-page="laundry">
    <span class="nav-icon">🧺</span>Стирки
  </button>
  <button class="nav-button" data-page="history">
    <span class="nav-icon">🕊️</span>История
  </button>
  <button class="nav-button" data-page="settings">
    <span class="nav-icon">⚙️</span>Настройки
  </button>
</nav>

<div class="toast" id="toast"></div>
</div>

<script>
'use strict';

const STORAGE_KEY = 'belyo_doma_v2';
const SETTINGS_KEY = 'belyo_doma_settings_v1';
const MACHINES_KEY = 'belyo_doma_machines_v1';
const PROGRAMS_KEY = 'belyo_doma_programs_v1';

let loads = [];
let settings = {
  theme:'sage',
  timeFormat:'24',
  notifications:false,
  showWeather:true,
  defaultMachine:'Машинка 1',
  language:'ru'
};
let machines = ['Машинка 1'];
let customPrograms = [];
let editingId = null;
let currentPage = 'home';
let weather = {temp:null,humidity:null,code:null};
let notified = new Set();
let toastTimer = null;

const $ = id => document.getElementById(id);

function toast(message){
  const el = $('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'),2600);
}

function readStorage(key,fallback){
  try{
    const value = JSON.parse(localStorage.getItem(key));
    return value === null ? fallback : value;
  }catch(e){
    return fallback;
  }
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(loads));
  }catch(e){
    toast('Не удалось сохранить данные. Проверь память браузера.');
  }
}

function saveSettings(){
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
}

function saveMachines(){
  localStorage.setItem(MACHINES_KEY,JSON.stringify(machines));
}

function savePrograms(){
  localStorage.setItem(PROGRAMS_KEY,JSON.stringify(customPrograms));
}

function loadSaved(){
  const saved = readStorage(STORAGE_KEY,[]);
  loads = Array.isArray(saved) ? saved : [];

  settings = {
    ...settings,
    ...readStorage(SETTINGS_KEY,{})
  };

  const savedMachines = readStorage(MACHINES_KEY,['Машинка 1']);
  machines = Array.isArray(savedMachines) && savedMachines.length
    ? savedMachines : ['Машинка 1'];

  const savedPrograms = readStorage(PROGRAMS_KEY,[]);
  customPrograms = Array.isArray(savedPrograms) ? savedPrograms : [];

  // Поддерживаем старые записи, созданные предыдущей версией сайта.
  loads = loads.map(item=>({
    ...item,
    machine:item.machine || machines[0] || 'Машинка 1',
    startedAt:Number(item.startedAt) || Number(item.createdAt) || Date.now(),
    duration:Number(item.duration) || 60,
    done:Boolean(item.done)
  }));

  applyTheme();
}

function applyTheme(){
  document.body.classList.remove('theme-pink','theme-lilac','theme-dark');
  if(settings.theme==='pink') document.body.classList.add('theme-pink');
  if(settings.theme==='lilac') document.body.classList.add('theme-lilac');
  if(settings.theme==='dark') document.body.classList.add('theme-dark');
  $('weatherCard').classList.toggle('hidden',!settings.showWeather);
}

function formatClock(timestamp){
  const date = new Date(timestamp);
  if(isNaN(date.getTime())) return '—';
  const options = {
    hour:'2-digit',
    minute:'2-digit',
    hour12:settings.timeFormat==='12'
  };
  return date.toLocaleTimeString('ru-RU',options);
}

function formatDateTime(timestamp){
  const date = new Date(timestamp);
  if(isNaN(date.getTime())) return '—';
  return date.toLocaleDateString('ru-RU',{
    day:'2-digit',month:'short'
  })+' · '+formatClock(timestamp);
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function fabricName(value){
  const names = {
    cotton:'Хлопок',
    synthetic:'Синтетика',
    mixed:'Смешанная ткань',
    delicate:'Деликатное',
    towels:'Полотенца',
    bed:'Постельное бельё'
  };
  return names[value] || value || 'Не указано';
}

function placeName(value){
  const names = {
    balcony:'Балкон',
    glazed:'Застеклённый балкон',
    radiator:'Батарея',
    room:'В комнате',
    dryer:'Сушильная машина'
  };
  return names[value] || value || 'Не указано';
}

function spinName(value){
  return ({low:'Низкий',medium:'Средний',high:'Высокий'})[value] || 'Средний';
}

function amountName(value){
  return ({small:'Немного',medium:'Средняя загрузка',large:'Много'})[value] || 'Средняя загрузка';
}

function airName(value){
  return ({still:'Почти нет воздуха',normal:'Обычное',windy:'Хорошее проветривание'})[value] || 'Обычное';
}

function dryMinutes(item){
  let minutes = ({
    cotton:165,
    synthetic:100,
    mixed:135,
    delicate:115,
    towels:190,
    bed:180
  })[item.fabric] || 145;

  if(item.spin==='low') minutes += 35;
  if(item.spin==='high') minutes -= 20;
  if(item.amount==='small') minutes -= 20;
  if(item.amount==='large') minutes += 35;
  if(item.air==='still') minutes += 25;
  if(item.air==='windy') minutes -= 30;
  if(item.place==='glazed') minutes += 10;
  if(item.place==='radiator') minutes -= 25;
  if(item.place==='room') minutes += 30;
  if(item.place==='dryer') minutes = Math.min(minutes,90);

  if(weather.humidity!==null && item.place!=='dryer'){
    if(weather.humidity>=80) minutes += 35;
    else if(weather.humidity>=65) minutes += 20;
    else if(weather.humidity<=40) minutes -= 15;
  }

  if(weather.temp!==null && item.place!=='dryer'){
    if(weather.temp<5) minutes += 25;
    else if(weather.temp>25) minutes -= 15;
  }

  return Math.max(30,Math.round(minutes/5)*5);
}

function formatDuration(ms){
  if(ms<=0) return 'сейчас';
  const minutes = Math.ceil(ms/60000);
  if(minutes<60) return minutes+' мин';
  const hours = Math.floor(minutes/60);
  const rest = minutes%60;
  return rest ? hours+' ч '+rest+' мин' : hours+' ч';
}

function stage(item){
  if(item.done){
    return {
      stage:2,title:'Завершено ✨',progress:100,
      remaining:'Готово',endTime:item.finishedAt || null
    };
  }

  const now = Date.now();
  const washEnd = item.startedAt + item.duration*60000;

  if(now<washEnd){
    const progress = Math.max(1,Math.min(99,
      Math.round((now-item.startedAt)/(item.duration*60000)*100)
    ));
    return {
      stage:0,title:'Стирается',progress,
      remaining:formatDuration(washEnd-now),
      endTime:washEnd
    };
  }

  const drying = dryMinutes(item);
  const dryEnd = washEnd + drying*60000;

  if(now<dryEnd){
    const progress = Math.max(1,Math.min(99,
      Math.round((now-washEnd)/(drying*60000)*100)
    ));
    return {
      stage:1,title:'Сушится',progress,
      remaining:formatDuration(dryEnd-now),
      endTime:dryEnd
    };
  }

  return {
    stage:2,title:'Пора проверить',progress:100,
    remaining:'Время проверить бельё',endTime:dryEnd
  };
}

function activeLoads(){
  return loads.filter(x=>!x.done);
}

function sortedLoads(list){
  return [...list].sort((a,b)=>{
    const sa=stage(a), sb=stage(b);
    if(sa.stage!==sb.stage) return sa.stage-sb.stage;
    return a.startedAt-b.startedAt;
  });
}

function machineOptions(selected){
  return machines.map(machine=>
    `<option value="${escapeHtml(machine)}" ${machine===selected?'selected':''}>${escapeHtml(machine)}</option>`
  ).join('');
}

function programOptions(selected){
  const builtIn = [
    ['cotton','Хлопок'],
    ['synthetic','Синтетика'],
    ['mixed','Смешанная ткань'],
    ['delicate','Деликатное'],
    ['towels','Полотенца'],
    ['bed','Постельное бельё']
  ];
  const all = builtIn.concat(customPrograms.map(p=>[p.fabric,p.name]));
  return all.map(([value,name])=>
    `<option value="${escapeHtml(value)}" ${value===selected?'selected':''}>${escapeHtml(name)}</option>`
  ).join('');
}

function loadCard(item,historyMode=false){
  const s = stage(item);
  const dry = dryMinutes(item);
  const washEnd = item.startedAt + item.duration*60000;
  const dryEnd = washEnd + dry*60000;
  const actualDone = item.done;

  return `
    <div class="card load-card">
      <div class="load-top">
        <div>
          <div class="load-name">${escapeHtml(item.name)}</div>
          <div class="load-place">${escapeHtml(item.machine || machines[0])} · ${escapeHtml(placeName(item.place))}</div>
        </div>
        <div class="badge">${actualDone?'Завершено ✓':s.title}</div>
      </div>

      <div class="progress-wrap">
        <div class="progress" style="width:${s.progress}%"></div>
      </div>

      <div class="info">
        <span>${actualDone?'Завершено':s.stage===0?'До конца стирки':'До окончания сушки'}</span>
        <strong>${actualDone?formatClock(item.finishedAt || item.startedAt):s.remaining}</strong>
      </div>

      <div class="info">
        <span>Начало</span>
        <span>${formatDateTime(item.startedAt)}</span>
      </div>

      <div class="info">
        <span>Окончание стирки</span>
        <span>${formatClock(washEnd)}</span>
      </div>

      <div class="info">
        <span>Ориентировочно сухое</span>
        <span>${formatClock(dryEnd)}</span>
      </div>

      <div class="info">
        <span>Ткань · отжим</span>
        <span>${escapeHtml(fabricName(item.fabric))} · ${escapeHtml(spinName(item.spin))}</span>
      </div>

      ${item.notes?`<div class="info"><span>Заметка</span><span>${escapeHtml(item.notes)}</span></div>`:''}

      <div class="actions">
        ${!historyMode?`
          <button class="action" data-action="edit" data-id="${escapeHtml(item.id)}">Изменить</button>
          ${!item.done?`<button class="action primary" data-action="finish" data-id="${escapeHtml(item.id)}">Готово ✓</button>`:''}
          <button class="action pink" data-action="delete" data-id="${escapeHtml(item.id)}">Удалить</button>
        `:`
          <button class="action" data-action="restore" data-id="${escapeHtml(item.id)}">Вернуть в стирки</button>
          <button class="action pink" data-action="delete" data-id="${escapeHtml(item.id)}">Удалить</button>
        `}
      </div>
    </div>
  `;
}

function renderHome(){
  const list = sortedLoads(activeLoads());
  return `
    <div class="section-head">
      <h2>Сейчас сушится</h2>
      <span class="counter">${list.filter(x=>stage(x).stage===1).length}</span>
    </div>
    <div class="section-caption">Здесь отображаются все незавершённые стирки. Можно вести несколько одновременно.</div>
    ${list.length?list.map(x=>loadCard(x)).join(''):`
      <div class="card empty">
        <div class="empty-icon">🧺</div>
        <div class="empty-title">Пока здесь пусто</div>
        <div style="margin-top:5px">Добавь первую стирку — будем следить за ней вместе ♡</div>
      </div>
    `}

function render(){
  const page = $('pageContent');
  if(currentPage==='home') page.innerHTML=renderHome();
  else if(currentPage==='laundry') page.innerHTML=renderLaundry();
  else if(currentPage==='history') page.innerHTML=renderHistory();
  else if(currentPage==='settings') page.innerHTML=renderSettings();

  document.querySelectorAll('.nav-button').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.page===currentPage);
  });

  $('weatherCard').classList.toggle('hidden',!settings.showWeather);
  $('greeting').textContent = 'Привет! 🧺';
  $('subtitle').textContent = currentPage==='settings'
    ? 'Всё можно настроить под себя ♡'
    : currentPage==='history'
      ? 'Все твои завершённые стирки в одном месте.'
      : currentPage==='laundry'
        ? 'Следим за каждой загрузкой.'
        : 'Посмотрим, что сейчас сушится?';
}

function cancelForm(){
  currentPage='home';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function getDuration(){
  if($('duration').value==='custom'){
    const custom=Number($('customDuration').value);
    if(!Number.isFinite(custom)||custom<1||custom>1440){
      toast('Укажи длительность от 1 до 1440 минут');
      return null;
    }
    return Math.round(custom);
  }
  return Number($('duration').value);
}

function getStartTime(){
  if($('startMode').value==='custom'){
    if(!$('customStart').value){
      toast('Укажи дату и время начала');
      return null;
    }
    const date=new Date($('customStart').value);
    if(isNaN(date.getTime())){
      toast('Проверь дату и время');
      return null;
    }
    if(date.getTime()>Date.now()+60000){
      toast('Время начала не может быть в будущем');
      return null;
    }
    return date.getTime();
  }
  return Date.now();
}

function saveLoad(){
  const duration=getDuration();
  if(duration===null) return;

  const startedAt=getStartTime();
  if(startedAt===null) return;

  const id=editingId||String(Date.now())+'_'+Math.random().toString(36).slice(2,7);
  const old=loads.find(x=>x.id===id);

  const data={
    id,
    name:$('name').value.trim()||'Моя стирка',
    machine:$('machine').value||machines[0],
    duration,
    fabric:$('fabric').value,
    spin:$('spin').value,
    place:$('place').value,
    amount:$('amount').value,
    air:$('air').value,
    notes:$('notes').value.trim(),
    startedAt,
    createdAt:old?.createdAt||Date.now(),
    done:old?.done||false,
    finishedAt:old?.finishedAt||null
  };

  if(old){
    const index=loads.findIndex(x=>x.id===id);
    loads[index]=data;
  }else{
    loads.unshift(data);
  }

  save();
  currentPage='home';
  editingId=null;
  render();
  toast(old?'Стирка обновлена ✨':'Стирка добавлена 🧺');
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteLoad(id){
  if(!confirm('Удалить эту стирку?')) return;
  loads=loads.filter(x=>x.id!==id);
  save();
  render();
  toast('Стирка удалена');
}

function markDone(id){
  const item=loads.find(x=>x.id===id);
  if(!item) return;
  item.done=true;
  item.finishedAt=Date.now();
  save();
  render();
  toast('Записала в историю ✨');
}

function restoreLoad(id){
  const item=loads.find(x=>x.id===id);
  if(!item) return;
  item.done=false;
  item.finishedAt=null;
  // Не начинаем старую стирку заново: время остаётся прежним.
  save();
  currentPage='laundry';
  render();
  toast('Вернула в активные стирки');
}

function changePage(page){
  currentPage=page;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function addMachine(){
  const name=prompt('Как назвать машинку? Например, Машинка 2');
  if(!name) return;
  const clean=name.trim().slice(0,40);
  if(!clean) return;
  if(machines.some(x=>x.toLowerCase()===clean.toLowerCase())){
    toast('Такая машинка уже есть');
    return;
  }
  machines.push(clean);
  settings.defaultMachine=clean;
  saveMachines();
  saveSettings();
  render();
  toast('Машинка добавлена 🧺');
}

function removeMachine(index){
  if(machines.length<=1){
    toast('Нужно оставить хотя бы одну машинку');
    return;
  }
  const name=machines[index];
  if(loads.some(x=>x.machine===name&&!x.done)){
    if(!confirm('У этой машинки есть активные стирки. Удалить её из списка?')) return;
  }else if(!confirm('Удалить машинку «'+name+'»?')) return;

  const replacement=machines.find((_,i)=>i!==index);
  machines.splice(index,1);
  loads.forEach(x=>{
    if(x.machine===name) x.machine=replacement;
  });
  if(settings.defaultMachine===name) settings.defaultMachine=replacement;
  saveMachines();
  saveSettings();
  save();
  render();
  toast('Список машинок обновлён');
}

function addProgram(){
  const name=prompt('Название своей программы, например «Детские вещи»');
  if(!name||!name.trim()) return;
  const clean=name.trim().slice(0,50);
  const fabric=prompt('Тип ткани: cotton, synthetic, mixed, delicate, towels или bed','mixed');
  const allowed=['cotton','synthetic','mixed','delicate','towels','bed'];
  const chosen=(fabric||'mixed').trim().toLowerCase();
  if(!allowed.includes(chosen)){
    toast('Неизвестный тип ткани. Используй mixed, cotton и т. д.');
    return;
  }
  if(customPrograms.some(p=>p.name.toLowerCase()===clean.toLowerCase())){
    toast('Программа с таким названием уже есть');
    return;
  }
  customPrograms.push({name:clean,fabric:chosen});
  savePrograms();
  render();
  toast('Своя программа добавлена ♡');
}

function removeProgram(index){
  if(!confirm('Удалить эту программу из списка?')) return;
  customPrograms.splice(index,1);
  savePrograms();
  render();
  toast('Программа удалена');
}

function exportData(){
  const data={
    version:2,
    exportedAt:new Date().toISOString(),
    loads,settings,machines,customPrograms
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='belyo-doma-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Резервная копия подготовлена');
}

function importData(){
  $('importFile').click();
}

function resetSettings(){
  if(!confirm('Сбросить оформление и настройки? Стирки и история останутся.')) return;
  settings={
    theme:'sage',
    timeFormat:'24',
    notifications:false,
    showWeather:true,
    defaultMachine:machines[0]||'Машинка 1',
    language:'ru'
  };
  saveSettings();
  applyTheme();
  render();
  toast('Настройки сброшены');
}

async function requestNotifications(){
  if(!('Notification' in window)){
    toast('Этот браузер не поддерживает уведомления');
    return false;
  }
  try{
    const permission=await Notification.requestPermission();
    if(permission==='granted'){
      settings.notifications=true;
      saveSettings();
      toast('Уведомления разрешены 🔔');
      render();
      return true;
    }
    settings.notifications=false;
    saveSettings();
    toast('Разрешение на уведомления не выдано');
    render();
    return false;
  }catch(e){
    toast('Не удалось включить уведомления');
    return false;
  }
}

function alertUser(title,body){
  if(settings.notifications &&
     'Notification' in window &&
     Notification.permission==='granted'){
    try{
      new Notification(title,{body});
      return;
    }catch(e){}
  }
  toast(title+': '+body);
}

function checkAlerts(){
  for(const item of loads){
    if(item.done) continue;
    const s=stage(item);
    const washEnd=item.startedAt+item.duration*60000;

    if(s.stage>=1 && Date.now()>=washEnd && !notified.has(item.id+':wash')){
      notified.add(item.id+':wash');
      alertUser('Стирка закончилась','«'+item.name+'»: пора развесить бельё.');
    }
    if(s.stage>=2 && !notified.has(item.id+':dry')){
      notified.add(item.id+':dry');
      alertUser('Пора проверить бельё','«'+item.name+'»: расчётное время сушки прошло.');
    }
  }
  if(currentPage==='home'||currentPage==='laundry') render();
}

function weatherDescription(code){
  if(code===0) return {icon:'☀️',text:'Ясно'};
  if([1,2,3].includes(code)) return {icon:'🌤️',text:'Облачно'};
  if([45,48].includes(code)) return {icon:'🌫️',text:'Туман'};
  if([51,53,55,56,57].includes(code)) return {icon:'🌦️',text:'Морось'};
  if([61,63,65,66,67].includes(code)) return {icon:'🌧️',text:'Дождь'};
  if([71,73,75,77].includes(code)) return {icon:'🌨️',text:'Снег'};
  if([80,81,82].includes(code)) return {icon:'🌦️',text:'Ливень'};
  if([95,96,99].includes(code)) return {icon:'⛈️',text:'Гроза'};
  return {icon:'☁️',text:'Погода'};
}

async function loadWeather(){
  if(!settings.showWeather) return;
  $('weatherText').textContent='Обновляем погоду…';

  try{
    let latitude=55.79;
    let longitude=42.74;

    if(navigator.geolocation){
      try{
        const position=await new Promise((resolve,reject)=>{
          navigator.geolocation.getCurrentPosition(resolve,reject,{
            enableHighAccuracy:false,timeout:4000,maximumAge:600000
          });
        });
        latitude=position.coords.latitude;
        longitude=position.coords.longitude;
      }catch(e){}
    }

    const url='https://api.open-meteo.com/v1/forecast'
      +'?latitude='+latitude
      +'&longitude='+longitude
      +'&current=temperature_2m,relative_humidity_2m,weather_code'
      +'&timezone=auto';

    const response=await fetch(url);
    if(!response.ok) throw new Error('Weather request failed');
    const data=await response.json();
    if(!data.current) throw new Error('No weather data');

    weather.temp=Math.round(data.current.temperature_2m);
    weather.humidity=data.current.relative_humidity_2m;
    weather.code=data.current.weather_code;

    const info=weatherDescription(weather.code);
    $('weatherIcon').textContent=info.icon;
    $('weatherTemp').textContent=(weather.temp>0?'+':'')+weather.temp+'°';
    $('weatherText').textContent=info.text+' · влажность '+weather.humidity+'%';

    if(currentPage==='home'||currentPage==='laundry') render();
  }catch(e){
    $('weatherIcon').textContent='🌤️';
    $('weatherTemp').textContent='—°';
    $('weatherText').textContent='Погода временно недоступна';
  }
}

$('pageContent').addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');
  if(!button) return;

  const action=button.dataset.action;
  const id=button.dataset.id;

  if(action==='add') openForm();
  else if(action==='edit') openForm(id);
  else if(action==='delete') deleteLoad(id);
  else if(action==='finish') markDone(id);
  else if(action==='restore') restoreLoad(id);
  else if(action==='cancelForm') cancelForm();
  else if(action==='saveLoad') saveLoad();
  else if(action==='addMachine') addMachine();
  else if(action==='removeMachine') removeMachine(Number(button.dataset.index));
  else if(action==='addProgram') addProgram();
  else if(action==='removeProgram') removeProgram(Number(button.dataset.index));
  else if(action==='exportData') exportData();
  else if(action==='importData') importData();
  else if(action==='resetSettings') resetSettings();
  else if(action==='clearHistory'){
    if(confirm('Удалить все завершённые стирки из истории?')){
      loads=loads.filter(x=>!x.done);
      save();
      render();
      toast('История очищена');
    }
  }
  else if(action==='testNotification'){
    if(!settings.notifications){
      const granted=await requestNotifications();
      if(!granted) return;
    }
    alertUser('Бельё дома 🧺','Проверка уведомлений прошла успешно!');
  }
});

$('pageContent').addEventListener('change',async event=>{
  const el=event.target;

  if(el.id==='duration'){
    $('customDuration').classList.toggle('hidden',el.value!=='custom');
  }

  if(el.id==='startMode'){
    $('customStart').classList.toggle('hidden',el.value!=='custom');
    if(el.value==='custom'&&!$('customStart').value){
      const now=new Date();
      $('customStart').value=
        `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
  }

  if(el.id==='settingTheme'){
    settings.theme=el.value;
    saveSettings();
    applyTheme();
    toast('Тема обновлена 🎨');
  }

  if(el.id==='settingTime'){
    settings.timeFormat=el.value;
    saveSettings();
    render();
    toast('Формат времени изменён');
  }

  if(el.id==='settingWeather'){
    settings.showWeather=el.checked;
    saveSettings();
    applyTheme();
    render();
    if(el.checked) loadWeather();
  }

  if(el.id==='settingDefaultMachine'){
    settings.defaultMachine=el.value;
    saveSettings();
    toast('Машинка по умолчанию изменена');
  }

  if(el.id==='settingNotifications'){
    if(el.checked){
      await requestNotifications();
    }else{
      settings.notifications=false;
      saveSettings();
      render();
      toast('Напоминания выключены');
    }
  }
});

$('pageContent').addEventListener('change',async event=>{
  if(event.target.id!=='importFile') return;
  const file=event.target.files && event.target.files[0];
  if(!file) return;

  try{
    const data=JSON.parse(await file.text());
    if(!data || !Array.isArray(data.loads) || !Array.isArray(data.machines)){
      throw new Error('Invalid backup');
    }
    if(!confirm('Импортировать резервную копию? Текущие стирки и настройки будут заменены.')) return;

    loads=data.loads;
    if(data.settings && typeof data.settings==='object') settings={...settings,...data.settings};
    machines=data.machines.length?data.machines:['Машинка 1'];
    customPrograms=Array.isArray(data.customPrograms)?data.customPrograms:[];
    save();
    saveSettings();
    saveMachines();
    savePrograms();
    applyTheme();
    render();
    toast('Резервная копия восстановлена ✨');
  }catch(e){
    toast('Не удалось прочитать файл резервной копии');
  }finally{
    event.target.value='';
  }
});

document.querySelectorAll('.nav-button').forEach(button=>{
  button.addEventListener('click',()=>changePage(button.dataset.page));
});

$('refreshWeather').addEventListener('click',loadWeather);

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    loads=readStorage(STORAGE_KEY,loads);
    render();
    checkAlerts();
  }
});

loadSaved();
render();
loadWeather();

setInterval(()=>{
  checkAlerts();
},15000);
</script>
